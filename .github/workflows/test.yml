name: Test

on:
  push:
  pull_request:

jobs:
  api:
    name: Unit + API regression
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: calorie_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d calorie_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/calorie_tracker_test
      DIRECT_URL: postgresql://test:test@localhost:5432/calorie_tracker_test
      JWT_SECRET: test-jwt-secret-that-is-at-least-32-chars!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: cp .env.example .env
      - run: npx prisma generate
      - run: npm test

  e2e:
    name: UI regression
    runs-on: ubuntu-latest
    needs: api
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: calorie_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d calorie_tracker_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/calorie_tracker_test
      DIRECT_URL: postgresql://test:test@localhost:5432/calorie_tracker_test
      JWT_SECRET: test-jwt-secret-that-is-at-least-32-chars!!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Install API
        working-directory: server
        run: |
          npm ci
          cp .env.example .env
          npx prisma generate
          npx prisma migrate deploy
      - name: Install web
        working-directory: web
        run: |
          npm ci
          echo 'NEXT_PUBLIC_API_URL=http://localhost:4000/api' > .env.local
          npx playwright install --with-deps chromium
      - name: Run Playwright
        working-directory: web
        env:
          CI: true
        run: npm run test:e2e
